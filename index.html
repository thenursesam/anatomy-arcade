<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow">
<title>Slay Anatomy Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf3f7;
    --bg2:#f4e7ef;
    --surf:#ffffff;
    --ink:#201824;
    --ink2:#5c4f5a;
    --mut:#8a7d88;
    --line:#ecdfe7;
    --pink:#e6468a;
    --pink-deep:#c3306d;
    --gold:#d99a2b;
    --good:#1ea97c; --good-bg:#e4f6ef;
    --bad:#e23b5a; --bad-bg:#fdeaee;
    --streak:#d99a2b;
    --disp:"Bricolage Grotesque", system-ui, sans-serif;
    --body:"Inter", system-ui, sans-serif;
    --mono:"DM Mono", ui-monospace, monospace;
    --sys:#8a7cff; /* active system accent, set by JS */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:980px;margin:0 auto;padding:16px 16px 90px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* ===== Brand header ===== */
  .brand{display:flex;align-items:center;gap:14px;padding:10px 2px 12px;position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -16px;padding-left:16px;padding-right:16px}
  .badge{width:62px;height:62px;border-radius:50%;flex:none;object-fit:contain;display:block;
    box-shadow:0 6px 18px -10px var(--pink-deep)}
  .brandtext .k{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--pink-deep);text-transform:uppercase}
  .brandtext h1{font-family:var(--disp);font-weight:800;font-size:clamp(26px,5.5vw,38px);letter-spacing:-.01em;line-height:1;margin-top:2px}
  .brandtext h1 .u{position:relative}
  .brandtext h1 .u::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:5px;background:var(--pink);opacity:.9;z-index:-1;border-radius:3px}
  .brandtext .gold{color:var(--gold)}

  /* ===== Score strip ===== */
  .scores{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .score{flex:1;min-width:92px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 4px 14px -10px #c3306d33}
  .score .l{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
  .score .v{font-family:var(--mono);font-size:24px;margin-top:2px}
  .score.s1 .v{color:var(--pink)} .score.s2 .v{color:var(--gold)} .score.s3 .v{color:var(--ink)} .score.s4 .v{color:var(--good)}

  /* ===== System tabs ===== */
  .tabsbar{position:sticky;top:var(--brandH,0px);z-index:20;background:var(--bg);padding:8px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .tabs::-webkit-scrollbar{height:6px}.tabs::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .tab{flex:none;display:flex;align-items:center;gap:7px;background:var(--surf);border:1.5px solid var(--line);border-radius:999px;
    padding:8px 14px;font-size:13.5px;font-weight:700;color:var(--ink2);white-space:nowrap;transition:all .12s}
  .tab .ic{font-size:15px}
  .tab:hover{border-color:var(--accent)}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px -8px var(--accent)}

  /* ===== System header ===== */
  .syshead{display:flex;align-items:center;gap:12px;margin:16px 0 4px}
  .sysdot{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--sys) 16%,#fff);flex:none}
  .syshead h2{font-family:var(--disp);font-weight:800;font-size:25px;letter-spacing:-.01em}
  .syshead p{color:var(--mut);font-size:13px}
  .sysbar{height:4px;border-radius:3px;background:var(--sys);width:60px;margin:2px 0 14px;opacity:.85}

  /* ===== Mode chips ===== */
  .modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .mode{display:flex;align-items:center;gap:7px;background:var(--surf);border:1.5px solid var(--line);border-radius:12px;
    padding:9px 13px;font-size:13.5px;font-weight:700;color:var(--ink2);transition:all .12s}
  .mode:hover{border-color:var(--sys)}
  .mode[aria-pressed="true"]{background:color-mix(in srgb,var(--sys) 14%,#fff);border-color:var(--sys);color:var(--ink)}
  .mode .mi{font-size:15px}

  .progressbar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-bottom:16px;border:1px solid var(--line)}
  .progressbar i{display:block;height:100%;background:var(--sys);width:0;transition:width .3s}

  .panel{min-height:320px}

  /* ===== Flashcards ===== */
  .card3d{perspective:1600px;margin:0 auto;max-width:600px}
  .card{position:relative;width:100%;min-height:280px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);cursor:pointer}
  .card.flip{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:28px;display:flex;flex-direction:column;justify-content:center;
    border:1.5px solid var(--line);background:var(--surf);box-shadow:0 14px 36px -22px #c3306d44}
  .face.back{transform:rotateY(180deg);background:color-mix(in srgb,var(--sys) 8%,#fff);border-color:color-mix(in srgb,var(--sys) 40%,#fff)}
  .face .catlab{font-family:var(--mono);font-size:11px;letter-spacing:.1em;margin-bottom:14px;color:var(--sys);text-transform:uppercase}
  .face .qt{font-size:21px;font-weight:600;line-height:1.4}
  .face .at{font-size:20px;font-weight:700;color:var(--ink);line-height:1.45}
  .face .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--mut)}
  .fcbtns{display:flex;gap:10px;margin-top:16px;max-width:600px;margin-inline:auto}
  .fcbtns button{flex:1;padding:13px;border-radius:12px;font-weight:700;font-size:15px;border:1.5px solid var(--line);background:var(--surf)}
  .btn-again{color:var(--bad);border-color:#f3c9d2}.btn-again:hover{background:var(--bad-bg)}
  .btn-got{color:var(--good);border-color:#bfe6d6}.btn-got:hover{background:var(--good-bg)}
  .navrow{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--mut);font-size:13px;max-width:600px;margin-inline:auto}
  .navrow button{padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surf);font-weight:600;color:var(--ink)}
  .navrow button:hover{border-color:var(--sys)}

  /* ===== Quiz ===== */
  .qbox{max-width:620px;margin:0 auto}
  .qstem{background:var(--surf);border:1.5px solid var(--line);border-radius:16px;padding:20px;font-size:18px;font-weight:600;margin-bottom:14px;box-shadow:0 8px 24px -20px #c3306d44}
  .qstem .cattiny{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--sys);display:block;margin-bottom:8px;text-transform:uppercase}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{text-align:left;background:var(--surf);border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;font-size:15px;font-weight:500;transition:all .12s;display:flex;gap:12px;align-items:flex-start}
  .opt:hover:not(:disabled){border-color:var(--sys)}
  .opt .key{font-family:var(--mono);font-size:13px;color:var(--mut);border:1.5px solid var(--line);border-radius:7px;width:26px;height:26px;display:grid;place-items:center;flex:none}
  .opt.correct{background:var(--good-bg);border-color:var(--good)} .opt.correct .key{border-color:var(--good);color:var(--good)}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad)} .opt.wrong .key{border-color:var(--bad);color:var(--bad)}
  .opt:disabled{cursor:default}
  .explain{margin-top:14px;background:color-mix(in srgb,var(--gold) 12%,#fff);border:1px solid color-mix(in srgb,var(--gold) 35%,#fff);border-left:3px solid var(--gold);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--ink2);display:none}
  .explain.show{display:block}
  .qnext{margin-top:14px;width:100%;padding:14px;border-radius:12px;background:var(--sys);color:#fff;font-weight:800;font-size:16px;display:none}
  .qnext.show{display:block}

  .result{max-width:480px;margin:10px auto;text-align:center;background:var(--surf);border:1.5px solid var(--line);border-radius:20px;padding:32px 24px;box-shadow:0 14px 36px -24px #c3306d55}
  .result .big{font-family:var(--mono);font-size:54px;color:var(--good);line-height:1}
  .result h3{font-family:var(--disp);font-size:23px;margin:10px 0 4px}
  .result p{color:var(--mut);margin-bottom:18px}
  .result button{padding:12px 20px;border-radius:12px;font-weight:700;background:var(--sys);color:#fff;margin:4px}
  .result .ghost{background:var(--surf);color:var(--ink);border:1.5px solid var(--line)}

  /* ===== Match ===== */
  .matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:680px;margin:0 auto}
  .mcol{display:flex;flex-direction:column;gap:10px}
  .mitem{text-align:left;background:var(--surf);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:14px;font-weight:600;transition:all .12s;min-height:50px;box-shadow:0 6px 18px -18px #c3306d55}
  .mitem:hover:not(:disabled){border-color:var(--sys)}
  .mitem.sel{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 35%,#fff)}
  .mitem.matched{background:var(--good-bg);border-color:var(--good);color:var(--good);opacity:.7}
  .mitem.matched:disabled{cursor:default}
  .mitem.missmatch{animation:shake .35s;border-color:var(--bad)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .colhead{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--mut);margin-bottom:4px;text-align:center;text-transform:uppercase}

  /* ===== Sort ===== */
  .sortwrap{max-width:580px;margin:0 auto;text-align:center}
  .sortcard{background:var(--surf);border:1.5px solid var(--line);border-radius:18px;padding:32px 22px;font-size:19px;font-weight:600;min-height:140px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 10px 30px -22px #c3306d55}
  .sortcard.right{border-color:var(--good);background:var(--good-bg)}
  .sortcard.wrongflash{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}
  .buckets{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .bucket{flex:1;min-width:130px;padding:15px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surf);font-weight:700;font-size:15px}
  .bucket:hover{border-color:var(--sys);background:color-mix(in srgb,var(--sys) 8%,#fff)}
  .sortmeta{color:var(--mut);font-size:13px;margin-top:14px}

  /* ===== Flow / mnemonic ===== */
  .flowwrap,.mnem{max-width:620px;margin:0 auto}
  .flowtrack,.mnemword{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .flowslot{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:11px;padding:11px 14px;min-height:48px;color:var(--mut);font-size:14px;font-family:var(--mono)}
  .flowslot.filled{border-style:solid;border-color:var(--good);background:var(--good-bg);color:var(--ink);font-family:var(--body);font-weight:600}
  .flowslot .num{font-family:var(--mono);font-size:12px;color:var(--sys);width:22px;flex:none}
  .flowopts,.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
  .chip{background:var(--surf);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;font-size:14px;font-weight:600;box-shadow:0 6px 16px -16px #c3306d55}
  .chip:hover{border-color:var(--sys)}
  .chip.bad{animation:shake .35s}.chip.used{opacity:.3;pointer-events:none}
  .mrow{display:flex;align-items:center;gap:12px;background:var(--surf);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:54px;transition:all .2s}
  .mrow .let{font-family:var(--disp);font-weight:800;font-size:22px;min-width:40px;text-align:center;color:var(--mut);flex:none}
  .mrow.done{border-color:var(--good);background:var(--good-bg)}.mrow.done .let{color:var(--good)}
  .mrow .slot{color:var(--mut);font-style:italic;font-size:14px}.mrow.done .slot{color:var(--ink);font-style:normal;font-weight:600}
  .mrow.active{border-color:var(--sys);box-shadow:0 0 0 2px color-mix(in srgb,var(--sys) 30%,#fff)}
  .askchip{font-family:var(--mono);font-size:12px;color:var(--sys);margin-bottom:8px;text-align:center}
  .mnemtitle{text-align:center;font-weight:700;color:var(--ink2);font-size:14px;margin-bottom:10px}
  .mnemtitle b{color:var(--pink-deep)}

  /* toast */
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
    border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;opacity:0;transition:all .25s;pointer-events:none;z-index:60;box-shadow:0 16px 40px -18px #000}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.good{background:var(--good)}.toast.bad{background:var(--bad)}.toast.streak{background:var(--gold)}

  .foot{text-align:center;color:var(--mut);font-size:12px;margin-top:40px;font-family:var(--mono)}
  .foot a{color:var(--pink-deep);text-decoration:none}

  @media (max-width:520px){
    .face .qt{font-size:19px}.face .at{font-size:18px}.score{min-width:45%}
    .matchgrid{gap:8px}
  }
  @media (prefers-reduced-motion:reduce){.card{transition:none}*{scroll-behavior:auto}}
</style>
</head>

/* ============ APP STATE ============ */
var curSys=0, curMode="flash";

/* ============ TABS ============ */
function buildTabs(){
  var t=document.getElementById("tabs");t.innerHTML="";
  SYS.forEach(function(s,i){
    var b=document.createElement("button");b.className="tab";b.style.setProperty("--accent",s.color);
    b.setAttribute("aria-selected",i===curSys);
    b.innerHTML='<span class="ic">'+s.icon+'</span>'+s.name;
    b.onclick=function(){curSys=i;curMode="flash";renderSystem();};
    t.appendChild(b);
  });
}

function availableModes(s){
  var m=[{id:"flash",label:"Flashcards",ic:"🃏"},{id:"quiz",label:"Quiz",ic:"⚡"},{id:"match",label:"Match",ic:"🔗"}];
  if(s.sort) m.push({id:"sort",label:"Sort It",ic:"🗂️"});
  if(s.flow) m.push({id:"flow",label:s.flow.length>1?"Order It":"Order It",ic:"➡️"});
  if(s.mnem) m.push({id:"mnem",label:"Mnemonic",ic:"🔤"});
  return m;
}

function renderSystem(){
  var s=SYS[curSys];
  document.documentElement.style.setProperty("--sys",s.color);
  document.querySelectorAll("#tabs .tab").forEach(function(b,i){b.setAttribute("aria-selected",i===curSys);
    if(i===curSys)b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});});
  document.getElementById("sysdot").textContent=s.icon;
  document.getElementById("sysname").textContent=s.name;
  document.getElementById("sysdesc").textContent=s.desc;
  // modes
  var mwrap=document.getElementById("modes");mwrap.innerHTML="";
  var modes=availableModes(s);
  if(modes.filter(function(m){return m.id===curMode;}).length===0) curMode="flash";
  modes.forEach(function(m){
    var b=document.createElement("button");b.className="mode";b.setAttribute("aria-pressed",m.id===curMode);
    b.innerHTML='<span class="mi">'+m.ic+'</span>'+m.label;
    b.onclick=function(){curMode=m.id;renderSystem();};
    mwrap.appendChild(b);
  });
  var pr=document.getElementById("progwrap");pr.style.display=(curMode==="flash"||curMode==="quiz")?"block":"none";
  document.getElementById("prog").style.width="0%";
  var p=document.getElementById("panel");p.innerHTML="";
  if(curMode==="flash")startFlash(p,s);
  else if(curMode==="quiz")startQuiz(p,s);
  else if(curMode==="match")startMatch(p,s);
  else if(curMode==="sort")startSort(p,s);
  else if(curMode==="flow")startFlow(p,s);
  else if(curMode==="mnem")startMnem(p,s);
}

/* ============ FLASHCARDS ============ */
var fcList,fcIdx,fcFlip;
function startFlash(p,s){
  fcList=shuffle(s.flash);fcIdx=0;fcFlip=false;
  p.innerHTML='<div class="card3d"><div class="card" id="fcard">'+
    '<div class="face front"><div class="catlab">'+s.name+'</div><div class="qt" id="fcq"></div><div class="hint">tap to flip</div></div>'+
    '<div class="face back"><div class="catlab">Answer</div><div class="at" id="fca"></div><div class="hint">tap to flip back</div></div></div></div>'+
    '<div class="fcbtns"><button class="btn-again" id="fcAgain">↻ Review again</button><button class="btn-got" id="fcGot">✓ Got it</button></div>'+
    '<div class="navrow"><button id="fcPrev">‹ Prev</button><span id="fccount"></span><button id="fcNext">Next ›</button></div>';
  document.getElementById("fcard").onclick=function(){fcFlip=!fcFlip;this.classList.toggle("flip",fcFlip);};
  document.getElementById("fcAgain").onclick=function(){markCard(false);};
  document.getElementById("fcGot").onclick=function(){markCard(true);};
  document.getElementById("fcPrev").onclick=function(){stepCard(-1);};
  document.getElementById("fcNext").onclick=function(){stepCard(1);};
  showCard();
}
function showCard(){
  var c=fcList[fcIdx];fcFlip=false;var card=document.getElementById("fcard");if(!card)return;card.classList.remove("flip");
  document.getElementById("fcq").textContent=c.q;document.getElementById("fca").textContent=c.a;
  document.getElementById("fccount").textContent=(fcIdx+1)+" / "+fcList.length;
  document.getElementById("prog").style.width=((fcIdx+1)/fcList.length*100)+"%";
}
function stepCard(d){fcIdx=(fcIdx+d+fcList.length)%fcList.length;showCard();}
function markCard(got){var c=fcList[fcIdx];var key=SYS[curSys].id+"|"+c.q;
  if(got){S.mastered[key]=1;saveState();addScore(5);toast("Banked it ✓","good");}
  else{delete S.mastered[key];saveState();toast("We'll loop back ↻","bad");}
  renderVitals();setTimeout(function(){stepCard(1);},250);}

/* ============ QUIZ ============ */
var qList,qPos,qLock;
function startQuiz(p,s){qList=shuffle(s.quiz);qPos=0;p.innerHTML='<div class="qbox" id="qbox"></div>';showQ(s);}
function showQ(s){qLock=false;document.getElementById("prog").style.width=(qPos/qList.length*100)+"%";
  var box=document.getElementById("qbox");
  if(qPos>=qList.length){document.getElementById("prog").style.width="100%";
    box.innerHTML='<div class="result"><div class="big">'+S.streak+'</div><h3>Round complete</h3><p>Best streak: '+S.best+'. Jump to another system or mode to keep going.</p><button id="qgo">Run it again</button></div>';
    document.getElementById("qgo").onclick=function(){startQuiz(document.getElementById("panel"),s);};return;}
  var q=qList[qPos];var keys=["A","B","C","D"];var order=shuffle(q.o.map(function(_,i){return i;}));
  var h='<div class="qstem"><span class="cattiny">'+s.name+' · Q'+(qPos+1)+' of '+qList.length+'</span>'+q.q+'</div><div class="opts">';
  order.forEach(function(oi,di){h+='<button class="opt" data-orig="'+oi+'"><span class="key">'+keys[di]+'</span><span>'+q.o[oi]+'</span></button>';});
  h+='</div><div class="explain" id="qexp"></div><button class="qnext" id="qnext">Next question →</button>';
  box.innerHTML=h;
  box.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){answerQ(b,parseInt(b.getAttribute("data-orig"),10),q.x,s);};});
  document.getElementById("qnext").onclick=function(){qPos++;showQ(s);};
}
function answerQ(btn,chosen,correct,s){if(qLock)return;qLock=true;
  document.querySelectorAll("#qbox .opt").forEach(function(o){o.disabled=true;if(parseInt(o.getAttribute("data-orig"),10)===correct)o.classList.add("correct");});
  var q=qList[qPos];
  if(chosen===correct){addScore(10);hit();toast("Correct! +10","good");}else{btn.classList.add("wrong");miss();toast("Not quite — read the why","bad");}
  var e=document.getElementById("qexp");e.textContent="Why: "+q.e;e.classList.add("show");
  document.getElementById("qnext").classList.add("show");
}

/* ============ MATCH ============ */
var matchSetIdx,mSelL,mLeftN,mMatched;
function startMatch(p,s){matchSetIdx=0;p.innerHTML='';renderMatch(p,s);}
function renderMatch(p,s){
  var sets=s.match;var set=sets[matchSetIdx%sets.length];
  var pills=sets.length>1?'<div class="modes" style="margin-bottom:14px" id="msets"></div>':'';
  p.innerHTML=pills+'<div class="matchgrid"><div><div class="colhead">'+set.lh+'</div><div class="mcol" id="mL"></div></div>'+
    '<div><div class="colhead">'+set.rh+'</div><div class="mcol" id="mR"></div></div></div>';
  if(sets.length>1){var ms=document.getElementById("msets");sets.forEach(function(_,i){var b=document.createElement("button");b.className="mode";b.setAttribute("aria-pressed",i===matchSetIdx);b.textContent="Set "+(i+1);b.onclick=function(){matchSetIdx=i;renderMatch(p,s);};ms.appendChild(b);});}
  mSelL=null;mMatched=0;mLeftN=set.pairs.length;
  var left=set.pairs.map(function(pr,i){return{t:pr[0],id:i};});
  var right=shuffle(set.pairs.map(function(pr,i){return{t:pr[1],id:i};}));
  var L=document.getElementById("mL"),R=document.getElementById("mR");
  left.forEach(function(o){var b=document.createElement("button");b.className="mitem";b.textContent=o.t;b.onclick=function(){selL(b,o.id);};L.appendChild(b);});
  right.forEach(function(o){var b=document.createElement("button");b.className="mitem";b.textContent=o.t;b.onclick=function(){selR(b,o.id,p,s);};R.appendChild(b);});
}
function selL(btn,id){if(btn.classList.contains("matched"))return;document.querySelectorAll("#mL .mitem").forEach(function(x){x.classList.remove("sel");});btn.classList.add("sel");mSelL={btn:btn,id:id};}
function selR(btn,id,p,s){if(btn.classList.contains("matched")||!mSelL)return;
  if(id===mSelL.id){btn.classList.add("matched");btn.disabled=true;mSelL.btn.classList.remove("sel");mSelL.btn.classList.add("matched");mSelL.btn.disabled=true;mSelL=null;mMatched++;addScore(8);hit();toast("Linked! +8","good");
    if(mMatched===mLeftN)setTimeout(function(){toast("🎉 Set cleared!","streak");},300);}
  else{miss();btn.classList.add("missmatch");var sx=mSelL.btn;setTimeout(function(){btn.classList.remove("missmatch");sx.classList.remove("sel");},400);mSelL=null;toast("Not a pair","bad");}
}

/* ============ SORT ============ */
var soSetIdx,soOrder,soPos,soLock;
function startSort(p,s){soSetIdx=0;renderSort(p,s);}
function renderSort(p,s){
  var set=s.sort[soSetIdx%s.sort.length];
  p.innerHTML='<div class="sortwrap"><div class="sortcard" id="socard"></div><div class="buckets" id="sobk"></div><div class="sortmeta" id="someta"></div></div>';
  soOrder=shuffle(set.items.map(function(_,i){return i;}));soPos=0;showSort(p,s,set);
}
function showSort(p,s,set){soLock=false;var card=document.getElementById("socard");card.className="sortcard";
  if(soPos>=soOrder.length){card.textContent="✓ All sorted!";var bk=document.getElementById("sobk");bk.innerHTML='';var b=document.createElement("button");b.className="bucket";b.textContent="↻ Go again";b.onclick=function(){renderSort(p,s);};bk.appendChild(b);document.getElementById("someta").textContent="";return;}
  var item=set.items[soOrder[soPos]];card.textContent=item[0];
  var bk=document.getElementById("sobk");bk.innerHTML='';
  set.buckets.forEach(function(name,bi){var b=document.createElement("button");b.className="bucket";b.textContent=name;b.onclick=function(){ansSort(bi,p,s,set);};bk.appendChild(b);});
  document.getElementById("someta").textContent=(soPos+1)+" of "+soOrder.length;
}
function ansSort(chosen,p,s,set){if(soLock)return;var item=set.items[soOrder[soPos]];var card=document.getElementById("socard");
  if(chosen===item[1]){soLock=true;card.classList.add("right");addScore(7);hit();toast("Correct! +7","good");soPos++;setTimeout(function(){showSort(p,s,set);},550);}
  else{miss();card.classList.add("wrongflash");toast("Nope — it's "+set.buckets[item[1]],"bad");setTimeout(function(){card.classList.remove("wrongflash");},420);}
}

/* ============ FLOW (ordering) ============ */
var flSeq,flStep;
function startFlow(p,s){var f=s.flow[0];flSeq=f.seq;flStep=0;
  var h='<div class="flowwrap"><div class="mnemtitle">'+f.name+'</div><div class="flowtrack" id="fltrack"></div><div class="flowopts" id="flopts"></div></div>';
  p.innerHTML=h;
  var track=document.getElementById("fltrack");
  flSeq.forEach(function(_,i){var d=document.createElement("div");d.className="flowslot";d.id="fl"+i;d.innerHTML='<span class="num">'+(i+1)+'</span><span>—</span>';track.appendChild(d);});
  var opts=document.getElementById("flopts");
  shuffle(flSeq.map(function(t,i){return{t:t,id:i};})).forEach(function(o){var b=document.createElement("button");b.className="chip";b.textContent=o.t;b.onclick=function(){pickFlow(b,o.id);};opts.appendChild(b);});
}
function pickFlow(btn,id){if(btn.classList.contains("used"))return;
  if(id===flStep){var slot=document.getElementById("fl"+flStep);slot.classList.add("filled");slot.querySelector("span:last-child").textContent=flSeq[flStep];btn.classList.add("used");addScore(6);hit();flStep++;
    if(flStep===flSeq.length)setTimeout(function(){toast("🎉 Perfect sequence!","streak");},250);else toast("+6","good");}
  else{miss();btn.classList.add("bad");toast("Not next — think upstream","bad");setTimeout(function(){btn.classList.remove("bad");},400);}
}

/* ============ MNEMONIC ============ */
var mnItems,mnStep,mnSub;
function startMnem(p,s){var m=s.mnem[0];mnItems=m.items;mnSub=m.sub;mnStep=0;
  p.innerHTML='<div class="mnem"><div class="mnemtitle">'+mnSub+'</div><div class="mnemword" id="mnword"></div><div class="askchip" id="mnask"></div><div class="chips" id="mnchips"></div></div>';
  renderMnem();
}
function renderMnem(){
  var wrap=document.getElementById("mnword");wrap.innerHTML="";
  mnItems.forEach(function(it,i){var row=document.createElement("div");row.className="mrow"+(i<mnStep?" done":"")+(i===mnStep?" active":"");row.innerHTML='<div class="let">'+it[0]+'</div><div class="slot">'+(i<mnStep?it[1]:"—")+'</div>';wrap.appendChild(row);});
  var ask=document.getElementById("mnask");var chips=document.getElementById("mnchips");chips.innerHTML="";
  if(mnStep>=mnItems.length){ask.textContent="✓ Complete — you nailed all "+mnItems.length+"!";var b=document.createElement("button");b.className="chip";b.textContent="↻ Do it again";b.style.borderColor="var(--good)";b.style.color="var(--good)";b.onclick=function(){mnStep=0;renderMnem();};chips.appendChild(b);return;}
  ask.textContent='What is cranial nerve '+mnItems[mnStep][0]+'?';
  var pool=mnItems.map(function(x){return x[1];});
  var correct=mnItems[mnStep][1];
  var distract=shuffle(pool.filter(function(v){return v!==correct;})).slice(0,3);
  shuffle([correct].concat(distract)).forEach(function(txt){var c=document.createElement("button");c.className="chip";c.textContent=txt;c.onclick=function(){if(txt===correct){addScore(5);hit();mnStep++;renderMnem();toast("+5","good");}else{miss();c.classList.add("bad");toast("Try again","bad");setTimeout(function(){c.classList.remove("bad");},400);}};chips.appendChild(c);});
}

/* ============ STICKY BRAND OFFSET ============ */
function syncBrandHeight(){
  var b=document.querySelector(".brand");
  if(b) document.documentElement.style.setProperty("--brandH", b.offsetHeight + "px");
}
window.addEventListener("resize", syncBrandHeight);
window.addEventListener("load", syncBrandHeight);

/* ============ INIT ============ */
loadState();renderVitals();buildTabs();renderSystem();syncBrandHeight();
</script>
